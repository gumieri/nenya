name: CodeQL

# Actions are tag-pinned and enforced by .github/workflows/actions.lock
# (supply-chain hardening): GitHub verifies at run time that each tag still
# resolves to its locked commit, so a moved or hijacked tag fails the run
# instead of executing attacker code. Dependabot updates tags + lockfile
# together; manual bumps must relock with `gh actions-lock` (the CI lockfile
# job rejects out-of-sync edits).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}

      - uses: github/codeql-action/init@v4.39.1
        with:
          languages: go

      - uses: github/codeql-action/autobuild@v4.39.1
      - uses: github/codeql-action/analyze@v4.39.1
        with:
          category: '/language:go'
