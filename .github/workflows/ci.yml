name: CI

# Actions are tag-pinned and enforced by .github/workflows/actions.lock
# (supply-chain hardening): GitHub verifies at run time that each tag still
# resolves to its locked commit, so a moved or hijacked tag fails the run
# instead of executing attacker code. Dependabot updates tags + lockfile
# together; manual bumps must relock with `gh actions-lock` (the CI lockfile
# job rejects out-of-sync edits).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7.0.0
        id: setup-go
        with:
          go-version-file: go.mod
          # Zero-dependency module: go.sum is empty, so key the built-in
          # build-cache on go.mod instead.
          cache-dependency-path: go.mod

      - name: Test (race + coverage)
        # -coverpkg=./... instruments every package, so coverage exercised
        # THROUGH other packages' tests is attributed (without it, only each
        # package-under-test is instrumented — the phase-040 proxy/mcp
        # subpackage has no test files of its own and would profile at 0%).
        run: go test ./... -race -coverpkg=./... -coverprofile=coverage.out -timeout 5m

      - name: Vet
        run: go vet ./...

      - name: Coverage gates
        run: |
          set -eu
          # Floors start just below the measured baseline (2026-10-07:
          # total 75.4%, function-average per package) and ratchet up over
          # time — raise them, never lower them.
          #
          # Semantics: the total is statement coverage over packages WITH
          # tests — packages without any test files (deploy, examples) are
          # invisible to this gate. deploy/ and examples/ are embed-only
          # (go:embed surfaces, no logic) and intentionally stay invisible;
          # internal/version is visible since NENYA-310. Per-package checks
          # are function averages; a future subpackage (internal/pipeline/x)
          # folds into its parent's average.
          total_floor=74
          pipeline_floor=80
          auth_floor=77
          security_floor=85
          stream_floor=73
          # proxy floor (2026-11-04, re-based on -coverpkg=./... profiles;
          # ratcheted 82 → 84 on 2026-11-08 per NENYA-323): combined
          # function-average 86.0% (parent 86.2% + proxy/mcp 84.1%, 666
          # funcs), stable across the ratchet-period CI runs. Without
          # -coverpkg the subpackage profiles at 0%.
          proxy_floor=84

          go tool cover -func=coverage.out > cover-func.txt
          total=$(awk '/^total:/ {gsub(/%/,"",$3); print $3}' cover-func.txt)
          echo "total coverage: ${total}% (floor ${total_floor}%)"
          fail=0
          check() { # check <label> <measured> <floor>
            echo "  $1: $2% (floor $3%)"
            awk -v c="$2" -v f="$3" 'BEGIN {exit !(c+0 >= f+0)}' || fail=1
          }
          pkg_avg() { # function-average coverage for a package prefix
            awk -v pkg="github.com/nenya/$1/" \
              '{if (index($1, pkg) == 1) {gsub(/%/,"",$3); s+=$3; n++}} END {if (n) printf "%.1f", s/n; else print "0"}' \
              cover-func.txt
          }
          check total "$total" "$total_floor"
          check internal/pipeline "$(pkg_avg internal/pipeline)" "$pipeline_floor"
          check internal/auth "$(pkg_avg internal/auth)" "$auth_floor"
          check internal/security "$(pkg_avg internal/security)" "$security_floor"
          check internal/stream "$(pkg_avg internal/stream)" "$stream_floor"
          check internal/proxy "$(pkg_avg internal/proxy)" "$proxy_floor"
          exit "$fail"

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          # Pin: v2 schema required by .golangci.yml; "latest" lets an
          # unrelated release break CI.
          version: v2.11
