version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Supply-chain cooldown (zizmor dependabot-cooldown): freshly published
    # module releases soak for 7 days before Dependabot proposes them
    # (the implicit Dependabot default is 3). Security updates bypass the
    # cooldown.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Supply-chain cooldown: freshly published action releases soak for
    # 7 days before entering CI. Dependabot security updates bypass the
    # cooldown. Dependabot bumps update the workflow tags AND
    # .github/workflows/actions.lock atomically (lockfile-verified in
    # CI; see AGENTS.md §15 "CI Supply-Chain (Action Lockfiles)").
    cooldown:
      default-days: 7
